name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events
  push:
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# See the following, which includes links to supported macOS versions, including supported Xcode versions
# https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
jobs:
  release:
    continue-on-error: true   # racecar: scan job other jobs need
    name: 'Release'


    runs-on: ubuntu-latest

    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    permissions:
      id-token: write
      contents: write

    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
          # Allow updating existing releases if the workflow is triggered by release creation or re-run.
        allowUpdates: true
          # When the release is updated, delete the existing artifacts for replacement.
        removeArtifacts: true
          # If a release is being replaced, omit updating the name and body.
          # Allows for creating a release and filling these in before the workflow runs.
          # Then, the workflow will populate the release with the artifacts.
        omitNameDuringUpdate: true
        omitBodyDuringUpdate: true
          # Upload all MoltenVK CI artifacts as release assets.
        artifacts: "MoltenVK*/*"
        artifactErrorsFailBuild: true
